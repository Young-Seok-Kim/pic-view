# ===========================================================
#  정읍 시선 — 빌드 컨테이너 (빌드 전용)
#
#  에뮬레이터 설치·확인은 호스트에서 합니다 → scripts/deploy.sh
#  처음 쓰신다면 docker/README.md 를 먼저 보세요.
#
#    docker compose -f docker/docker-compose.yml build          # 이미지 (처음 1회)
#    docker compose -f docker/docker-compose.yml run --rm aab   # 스토어용 AAB
#    docker compose -f docker/docker-compose.yml run --rm test  # 단위 테스트
#    docker compose -f docker/docker-compose.yml run --rm apk   # 디버그 APK
# ===========================================================

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: picview-build:2.0

  volumes:
    # 소스는 읽기 전용으로 넣습니다. 컨테이너가 호스트 파일을 못 고칩니다.
    - ..:/src:ro
    # APK/AAB 가 여기로 나옵니다.
    - ../build-output:/out
    # Gradle 캐시. 없으면 실행할 때마다 의존성을 처음부터 다시 받습니다
    # (네이버 지도 SDK 등 때문에 첫 빌드가 몇 분 걸립니다).
    - gradle-cache:/root/.gradle

  environment:
    # 키는 이미지에 굽지 않고 실행할 때 주입합니다.
    # 이미지에 넣으면 레이어에 남아 누구나 꺼낼 수 있습니다.
    TOUR_API_KEY: ${TOUR_API_KEY:-}
    NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
    NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    KAKAO_NATIVE_APP_KEY: ${KAKAO_NATIVE_APP_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # 프로젝트 루트의 .env 에서 위 값을 읽습니다. 없어도 빌드는 됩니다.
  env_file:
    - path: ../.env
      required: false

services:
  # 스토어 업로드용 AAB
  aab:
    <<: *common
    command: ["./gradlew", "bundleRelease", "--no-daemon"]

  # 디버그 APK
  apk:
    <<: *common
    command: ["./gradlew", "assembleDebug", "--no-daemon"]

  # 단위 테스트
  test:
    <<: *common
    command: ["./gradlew", "testDebugUnitTest", "--no-daemon"]

volumes:
  gradle-cache:
