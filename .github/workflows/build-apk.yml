# 디버그 APK 빌드.
#
# 릴리즈 서명(jks)은 로컬에만 있으므로 CI 는 디버그 빌드만 만듭니다.
# 워크플로가 끝나면 Actions 실행 페이지의 Artifacts 에서
# picview-debug-apk 를 내려받을 수 있습니다.
name: Build APK

on:
  push:
    branches: [ main, 'feat/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # secrets-gradle-plugin 이 읽는 파일. 값은 local.defaults.properties 가 채웁니다.
      - name: Create empty local.properties
        run: touch local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: picview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
