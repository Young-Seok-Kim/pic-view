# 디버그 APK 빌드.
#
# 릴리즈 서명(jks)은 로컬에만 있으므로 CI 는 디버그 빌드만 만듭니다.
# 커밋 메시지에 "create apk" 가 포함된 푸시(또는 수동 실행)에서만 빌드하며,
# 워크플로가 끝나면 Actions 실행 페이지의 Artifacts 에서
# picview-debug-<커밋7자리> 를 내려받을 수 있습니다.
name: Build APK

on:
  push:
    branches: [ main, 'feat/**' ]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'create apk')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # secrets-gradle-plugin 이 읽는 파일. 값은 local.defaults.properties 가 채웁니다.
      - name: Create empty local.properties
        run: touch local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 어느 커밋의 APK 인지 파일 이름만 보고 알 수 있게 짧은 SHA 를 답니다.
      - name: Name the artifact by commit
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: picview-debug-${{ steps.meta.outputs.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 린트는 APK 를 올린 다음에 돌립니다.
      # 순서를 바꾸면 린트가 하나 깨진 날 APK 를 아예 못 받게 됩니다.
      # 결과는 실패로 표시되되 결과물은 손에 남아야 합니다.
      - name: Lint (debug)
        run: ./gradlew lintDebug --no-daemon

      # 실패했을 때 무엇이 걸렸는지 보려면 리포트가 필요합니다.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ steps.meta.outputs.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
